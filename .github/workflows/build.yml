name: Build OpenXLSX C# Wrapper

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        include:
          - os: windows-latest
            artifact-name: windows-dll
            artifact-path: build/Release/OpenXLSX_Wrapper.dll
          - os: ubuntu-latest
            artifact-name: linux-so
            artifact-path: build/libOpenXLSX_Wrapper.so
          - os: macos-latest
            artifact-name: macos-dylib
            artifact-path: build/libOpenXLSX_Wrapper.dylib

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --config Release

    - name: Dump Export Functions
      shell: cmd
      run: |
        cmake -E __run_co_compile -- dumpbin /exports build\Release\OpenXLSX_Wrapper.dll
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact-name }}
        path: ${{ matrix.artifact-path }}
