name: Build C++ Wrapper DLL

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Fix vcxproj Include Paths
      shell: pwsh
      run: |
        $vcxproj = "build/OpenXLSXWrapper.vcxproj"
        if (Test-Path $vcxproj) {
            # XMLとして安全にロード
            [xml]$xml = Get-Content $vcxproj
            
            # すべての AdditionalIncludeDirectories 要素を取得
            $ns = New-Object Xml.XmlNamespaceManager $xml.NameTable
            $ns.AddNamespace("ns", "http://microsoft.com")
            $nodes = $xml.SelectNodes("//ns:AdditionalIncludeDirectories", $ns)
            
            # 各要素にパスを安全に追加
            foreach ($node in $nodes) {
                if ($node -ne $null) {
                    # セミコロンで区切ってビルドディレクトリとOpenXLSXディレクトリを強制追加
                    $node.InnerText = "`$(ProjectDir);`$(ProjectDir)OpenXLSX;`$(ProjectDir)..;" + $node.InnerText
                }
            }
            
            # 保存
            $xml.Save($vcxproj)
            Write-Output "Successfully patched $vcxproj without corruption."
        } else {
            Write-Error "Could not find $vcxproj."
        }

    - name: Build Solution
      run: cmake --build build --config Release
