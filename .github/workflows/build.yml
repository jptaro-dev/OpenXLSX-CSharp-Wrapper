name: Build C++ Wrapper DLL

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Prepare Patch File
      shell: pwsh
      run: |
        # エラーを回避するために、まず空のパッチファイルを生成します
        New-Item -Path "${{ github.workspace }}/OpenXLSX_patch.cmake" -ItemType File -Force

    - name: Configure CMake
      run: >
        cmake -B build
        -DCMAKE_BUILD_TYPE=Release
        -DCMAKE_PROJECT_INCLUDE="${{ github.workspace }}/OpenXLSX_patch.cmake"

    - name: Fix vcxproj Include Paths
      shell: pwsh
      run: |
        # 生成された vcxproj ファイルに自動生成ヘッダーのパスを直接注入します
        $vcxproj = "build/OpenXLSXWrapper.vcxproj"
        if (Test-Path $vcxproj) {
          $content = Get-Content $vcxproj
          # プロジェクトディレクトリ、およびその中の OpenXLSX ディレクトリをインクルードパスに強制追加
          $incPath = "<AdditionalIncludeDirectories>`$(ProjectDir);`$(ProjectDir)OpenXLSX;`$(ProjectDir)..;%(AdditionalIncludeDirectories)</AdditionalIncludeDirectories>"
          $content = $content -replace "<AdditionalIncludeDirectories>", $incPath
          Set-Content -Path $vcxproj -Value $content
          Write-Output "Successfully patched $vcxproj"
        } else {
          Write-Error "Could not find $vcxproj. Please check the target name in your CMakeLists.txt."
        }

    - name: Build Solution
      run: cmake --build build --config Release
