name: Build C++ Wrapper DLL

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Inject OpenXLSX Custom Definitions
      shell: pwsh
      run: |
        $vcxproj = "build/OpenXLSXWrapper.vcxproj"
        if (Test-Path $vcxproj) {
            [xml]$xml = Get-Content $vcxproj
            $ns = New-Object Xml.XmlNamespaceManager $xml.NameTable
            $ns.AddNamespace("ns", "http://microsoft.com")
            
            # 1. 自動生成されるはずだったエクスポート定義の代わりに空のマクロをプリプロセッサに定義
            # これにより、ヘッダー内の「#include "OpenXLSX-Exports.hpp"」が通らなくてもコンパイルを継続させます。
            $macroNodes = $xml.SelectNodes("//ns:PreprocessorDefinitions", $ns)
            foreach ($node in $macroNodes) {
                if ($node -ne $null) {
                    $node.InnerText = "OPENXLSX_EXPORT=;OPENXLSX_NO_EXPORT=;" + $node.InnerText
                }
            }
            
            # 2. 存在しないファイルの読み込みエラー(C1083)を力技で回避するため、
            # 強制的に空の「OpenXLSX-Exports.hpp」を生成してプロジェクトのインクルードパス直下に配置します。
            $targetDir = "OpenXLSX/headers"
            if (!(Test-Path $targetDir)) {
                New-Item -ItemType Directory -Force -Path $targetDir
            }
            # 空のヘッダーファイルを生成
            New-Item -ItemType File -Force -Path "$targetDir/OpenXLSX-Exports.hpp"
            Set-Content -Path "$targetDir/OpenXLSX-Exports.hpp" -Value "// Fallback Export Macros`n#define OPENXLSX_EXPORT`n#define OPENXLSX_NO_EXPORT"
            
            $xml.Save($vcxproj)
            Write-Output "Successfully injected build fallbacks and created missing header."
        } else {
            Write-Error "Could not find $vcxproj."
        }

    - name: Build Solution
      run: cmake --build build --config Release
