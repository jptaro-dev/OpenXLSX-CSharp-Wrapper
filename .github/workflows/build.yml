name: Build C++ Wrapper DLL

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Patch Code and Configure CMake
      shell: pwsh
      run: |
        # 1. MSVCコンパイラに例外処理(/EHsc)、規格準拠(/permissive-)、C++17規格を指定
        cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="/EHsc /permissive- /std:c++17"
        
        $vcxproj = "build/OpenXLSXWrapper.vcxproj"
        if (Test-Path $vcxproj) {
            [xml]$xml = Get-Content $vcxproj
            $ns = New-Object Xml.XmlNamespaceManager $xml.NameTable
            $ns.AddNamespace("ns", "http://microsoft.com")
            
            # 2. 自動生成されるはずだったエクスポートマクロのダミー注入
            $macroNodes = $xml.SelectNodes("//ns:PreprocessorDefinitions", $ns)
            foreach ($node in $macroNodes) {
                if ($node -ne $null) {
                    $node.InnerText = "OPENXLSX_EXPORT=;OPENXLSX_NO_EXPORT=;" + $node.InnerText
                }
            }
            
            # 3. 根こそぎインクルードパスを追加（pugixmlが含まれそうなあらゆる候補地を網羅）
            $nodes = $xml.SelectNodes("//ns:AdditionalIncludeDirectories", $ns)
            foreach ($node in $nodes) {
                if ($node -ne $null) {
                    $extraPaths = @(
                        "`$(ProjectDir)OpenXLSX\headers",
                        "`$(ProjectDir)OpenXLSX\external\pugixml",
                        "`$(ProjectDir)OpenXLSX\external",
                        "`$(ProjectDir)external\pugixml",
                        "`$(ProjectDir)external",
                        "`$(ProjectDir)OpenXLSX",
                        "`$(ProjectDir)"
                    ) -join ";"
                    $node.InnerText = $extraPaths + ";" + $node.InnerText
                }
            }
            $xml.Save($vcxproj)
        }
        
        # 4. wrapper.cpp の特定行をピンポイントで安全に無効化（周辺コードを巻き添えにしない）
        $wrapperCpp = "wrapper.cpp"
        if (Test-Path $wrapperCpp) {
            $content = Get-Content $wrapperCpp
            # 他の変数定義を壊さないよう、末尾に「sheetView();」や「autoFilter();」だけが単体で呼ばれている部分を空行に置換
            $content = $content -replace '^\s*.*->sheetView\(\);\s*$', ''
            $content = $content -replace '^\s*.*->autoFilter\(\);\s*$', ''
            Set-Content -Path $wrapperCpp -Value $content
        }

        # 5. 前回の不足ヘッダーフォールバック
        $targetDir = "OpenXLSX/headers"
        if (!(Test-Path $targetDir)) { New-Item -ItemType Directory -Force -Path $targetDir }
        New-Item -ItemType File -Force -Path "$targetDir/OpenXLSX-Exports.hpp" -Value "#define OPENXLSX_EXPORT`n#define OPENXLSX_NO_EXPORT" -Force

    - name: Build Solution
      run: cmake --build build --config Release
